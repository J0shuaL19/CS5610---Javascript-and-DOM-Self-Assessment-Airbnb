<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>San Francisco Airbnb Listings</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <header>
      <div class="header-content container py-5">
        <p class="eyebrow">Explore San Francisco</p>
        <h1>Airbnb Listings</h1>
        <p>Here are the first 50 places from the Airbnb listings data.</p>
        <input
          id="search-input"
          class="form-control"
          type="search"
          placeholder="Search by listing name"
        />
      </div>
    </header>

    <main class="container py-5">
      <div class="listings-heading mb-4">
        <h2>Places to stay</h2>
        <p id="result-count"></p>
      </div>
      <p id="message" class="alert alert-light">Loading listings...</p>
      <section id="listings" class="row g-4"></section>
    </main>

    <script src="main.js"></script>
  </body>
</html>
